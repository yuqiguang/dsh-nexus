name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # The confined pipeline needs bubblewrap and iproute2; the runner image ships iproute2 but not
      # bubblewrap, and the tests skip (with a reason) rather than silently pass when it is missing.
      # Install it so the real isolation keeps being exercised in CI.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap iproute2
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor
      # (`kernel.apparmor_restrict_unprivileged_userns=1`). `bwrap` needs one to build its uid map,
      # and so does the suite's own `unshare --user`, so the confined checks and verification tests
      # would otherwise fail with "Operation not permitted" — or skip, which is honest but is not
      # coverage. Lift it for the run, then prove the capability is really there: the bare `unshare`
      # fails the step instead of letting a hollow green through.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
      # Serial on purpose: the suite runs against `dist/`, so `check` must pass and `build` must
      # finish before `test` starts. See CONTRIBUTING.
      - run: npm run check
      - run: npm run build
      - run: npm test
