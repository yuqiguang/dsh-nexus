name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # The confined local-check tests need bubblewrap and iproute2; the runner image ships
      # iproute2 but not bubblewrap, and the tests skip (with a reason) rather than silently
      # pass when it is missing. Install it so the real isolation keeps being exercised in CI.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap iproute2
      # Serial on purpose: the suite runs against `dist/`, so `check` must pass and `build` must
      # finish before `test` starts. See CONTRIBUTING.
      - run: npm run check
      - run: npm run build
      - run: npm test
